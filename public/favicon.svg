<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="chart" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="rgba(16,185,129,0.2)" stroke-width="12" stroke-dasharray="16 12"/>
  
  <!-- Academic Graduation Cap / Crest emblem -->
  <path d="M 256,120 L 380,170 L 256,220 L 132,170 Z" fill="url(#gold)" filter="url(#glow)"/>
  <path d="M 160,182 L 160,240 C 160,265 256,285 256,285 C 256,285 352,265 352,240 L 352,182" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Dynamic Growth Bar Chart Lines -->
  <g filter="url(#glow)">
    <path d="M 140,380 L 190,320 L 240,350 L 310,250 L 380,210" fill="none" stroke="url(#chart)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="380" cy="210" r="16" fill="#fbbf24" stroke="#ffffff" stroke-width="6"/>
  </g>
  
  <!-- EcoMastery Text Emblem -->
  <text x="256" y="445" text-anchor="middle" font-family="'Hanken Grotesk', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">ECOMASTERY</text>
</svg>
